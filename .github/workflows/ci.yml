name: ROS 2 build and replay
on: [push, pull_request]

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/ati_daq_ft
      - name: Install declared dependencies
        run: |
          apt-get update
          apt-get install -y gcc libc6-dev python3-rosdep \
            python3-colcon-ros python3-colcon-bash \
            python3-colcon-package-selection python3-colcon-test-result
          source /opt/ros/jazzy/setup.bash
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update
          cd ws
          rosdep install --from-paths src --ignore-src -r -y
      - name: Build and test without NI software
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ws
          colcon build --packages-select ati_daq_ft
          source install/setup.bash
          colcon test --packages-select ati_daq_ft --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose
